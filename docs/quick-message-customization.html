<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Message Customization Tips</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: system-ui; background:#f7f3eb; padding:2rem; color:#333; }
  .card { background:#fff; border:1px solid #e0d5c5; border-radius:10px; padding:1rem; }
</style>
</head>
<body>
<h1>Quick Message Customization Tips</h1>
<div class="card">
  <ul>
    <li>Replace placeholders (name, vehicle, timeline) before sending.</li>
    <li>Remove anything that does not apply to this customer.</li>
    <li>Ask one main question and end with one clear next step.</li>
    <li>Match the customer’s tone.</li>
    <li>Keep messages short and easy to answer.</li>
  </ul>
</div>
</body>
</html>
