<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compliance Dashboard</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="page-compliance fade-page">
    <div id="header"></div>
    <div id="sidebar"></div>

    <!-- Floating Dark Mode Toggle -->
    <button id="darkmode-toggle" class="darkmode-toggle">
        <span class="darkmode-icon">🌙</span>
        <span class="darkmode-label">Dark Mode</span>
    </button>

    <main>
        <h1>Compliance Dashboard</h1>
        <p class="section-intro">
            Learn and follow all dealership communication compliance rules.
        </p>

        <hr class="section-divider">

        <!-- Compliance Module Search Bar -->
        <div class="dashboard-search">
            <input id="compliance-search" class="search-input" placeholder="Search compliance modules…">
            <ul id="compliance-suggestions" class="search-suggestions"></ul>
        </div>

        <hr class="section-divider">

        <!-- Compliance Module Grid -->
        <section class="grid" id="compliance-grid"></section>
    </main>

    <div id="footer"></div>
    <div id="breadcrumbs"></div>

    <!-- Core Scripts -->
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/darkmode.js"></script>

    <!-- Compliance Dashboard Logic -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {

        /* ------------------------------
           COMPLIANCE MODULE LIST
        ------------------------------ */
        const modules = [
            { id: "compliance-texting", label: "Texting Compliance", href: "texting-compliance.html" },
            { id: "compliance-email", label: "Email Compliance", href: "email-compliance.html" },
            { id: "compliance-calls", label: "Call Compliance", href: "call-compliance.html" },
            { id: "privacy-rules", label: "Privacy Rules", href: "privacy-rules.html" },
            { id: "data-security", label: "Data Security", href: "data-security.html" }
        ];

        /* ------------------------------
           BUILD COMPLIANCE MODULE GRID
        ------------------------------ */
        const grid = document.getElementById("compliance-grid");

        modules.forEach(mod => {
            const completed = localStorage.getItem(`progress-${mod.id}`);
            const card = document.createElement("div");
            card.className = "card fade-in";

            card.innerHTML = `
                <div class="card-title">
                    <div class="card-title-icon icon-${mod.id}"></div>
                    <strong>${mod.label}</strong>
                    ${completed ? '<span class="badge badge-sage">Completed</span>' : ''}
                </div>
                <p>Open the ${mod.label} module.</p>
                <div class="card-actions">
                    <a href="${mod.href}" class="btn btn-primary">Open</a>
                    ${completed ? `<button class="btn btn-outline btn-certificate" data-module="${mod.id}">Certificate</button>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });

        /* ------------------------------
           CERTIFICATE BUTTON HOOKS
        ------------------------------ */
        grid.addEventListener("click", (e) => {
            const btn = e.target.closest(".btn-certificate");
            if (!btn) return;

            const moduleId = btn.getAttribute("data-module");
            const certPath = `../certificates/${moduleId}-certificate.html`;
            window.location.href = certPath;
        });

        /* ------------------------------
           COMPLIANCE MODULE SEARCH BAR
           + AUTOCOMPLETE
        ------------------------------ */
        const compInput = document.getElementById("compliance-search");
        const compList = document.getElementById("compliance-suggestions");

        if (compInput && compList) {
            compInput.addEventListener("input", () => {
                const term = compInput.value.toLowerCase();
                compList.innerHTML = "";

                if (!term) return;

                const matches = modules
                    .filter(m => m.label.toLowerCase().includes(term))
                    .slice(0, 8);

                matches.forEach(m => {
                    const li = document.createElement("li");
                    li.textContent = m.label;
                    li.className = "search-suggestion-item";
                    li.addEventListener("click", () => {
                        window.location.href = m.href;
                    });
                    compList.appendChild(li);
                });
            });
        }
    });
    </script>

</body>
</html>
