<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Training Dashboard</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="page-training fade-page">
    <div id="header"></div>
    <div id="sidebar"></div>

    <!-- Floating Dark Mode Toggle -->
    <button id="darkmode-toggle" class="darkmode-toggle">
        <span class="darkmode-icon">🌙</span>
        <span class="darkmode-label">Dark Mode</span>
    </button>

    <main>
        <h1>Training Dashboard</h1>
        <p class="section-intro">
            Search and open any training module, then track completion and certificates.
        </p>

        <!-- Section Divider -->
        <hr class="section-divider">

        <!-- Training Module Search Bar -->
        <div class="dashboard-search">
            <input id="training-search" class="search-input" placeholder="Search training modules…">
            <ul id="training-suggestions" class="search-suggestions"></ul>
        </div>

        <!-- Section Divider -->
        <hr class="section-divider">

        <!-- Training Module Grid -->
        <section class="grid" id="training-grid"></section>
    </main>

    <div id="footer"></div>
    <div id="breadcrumbs"></div>

    <!-- Core Scripts -->
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/darkmode.js"></script>

    <!-- Training Dashboard Logic -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {

        /* ------------------------------
           TRAINING MODULE LIST
        ------------------------------ */
        const modules = [
            { id: "qa", label: "QA", href: "../qa/QA.html" },
            { id: "kpi", label: "KPI", href: "../kpi/KPI.html" },
            { id: "brand", label: "Brand", href: "../brand/brand.html" },
            { id: "compliance", label: "Compliance", href: "../compliance/compliance.html" },
            { id: "continuity", label: "Continuity", href: "../continuity/continuity.html" },
            { id: "governance", label: "Governance", href: "../governance/governance.html" },
            { id: "customer-questions", label: "Customer Questions", href: "../questions/customer-questions.html" },
            // add more as needed
        ];

        /* ------------------------------
           BUILD TRAINING MODULE GRID
        ------------------------------ */
        const grid = document.getElementById("training-grid");

        modules.forEach(mod => {
            const completed = localStorage.getItem(`progress-${mod.id}`);
            const card = document.createElement("div");
            card.className = "card fade-in";

            card.innerHTML = `
                <div class="card-title">
                    <div class="card-title-icon icon-${mod.id}"></div>
                    <strong>${mod.label}</strong>
                    ${completed ? '<span class="badge badge-sage">Completed</span>' : ''}
                </div>
                <p>Open the ${mod.label} dashboard.</p>
                <div class="card-actions">
                    <a href="${mod.href}" class="btn btn-primary">Open</a>
                    ${completed ? `<button class="btn btn-outline btn-certificate" data-module="${mod.id}">Certificate</button>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });

        /* ------------------------------
           CERTIFICATE BUTTON HOOKS
        ------------------------------ */
        grid.addEventListener("click", (e) => {
            const btn = e.target.closest(".btn-certificate");
            if (!btn) return;

            const moduleId = btn.getAttribute("data-module");
            // Adjust this path to wherever you store certificates
            const certPath = `../certificates/${moduleId}-certificate.html`;
            window.location.href = certPath;
        });

        /* ------------------------------
           TRAINING MODULE SEARCH BAR
           + AUTOCOMPLETE
        ------------------------------ */
        const trainingInput = document.getElementById("training-search");
        const trainingList = document.getElementById("training-suggestions");

        if (trainingInput && trainingList) {
            trainingInput.addEventListener("input", () => {
                const term = trainingInput.value.toLowerCase();
                trainingList.innerHTML = "";

                if (!term) return;

                const matches = modules
                    .filter(m => m.label.toLowerCase().includes(term))
                    .slice(0, 8);

                matches.forEach(m => {
                    const li = document.createElement("li");
                    li.textContent = m.label;
                    li.className = "search-suggestion-item";
                    li.addEventListener("click", () => {
                        window.location.href = m.href;
                    });
                    trainingList.appendChild(li);
                });
            });
        }
    });
    </script>

</body>
</html>
