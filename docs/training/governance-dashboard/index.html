<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Governance Dashboard</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="page-governance fade-page">
    <div id="header"></div>
    <div id="sidebar"></div>

    <!-- Floating Dark Mode Toggle -->
    <button id="darkmode-toggle" class="darkmode-toggle">
        <span class="darkmode-icon">🌙</span>
        <span class="darkmode-label">Dark Mode</span>
    </button>

    <main>
        <h1>Governance Dashboard</h1>
        <p class="section-intro">
            Learn dealership governance policies, reporting rules, oversight standards, and escalation procedures.
        </p>

        <hr class="section-divider">

        <!-- Governance Module Search Bar -->
        <div class="dashboard-search">
            <input id="governance-search" class="search-input" placeholder="Search governance modules…">
            <ul id="governance-suggestions" class="search-suggestions"></ul>
        </div>

        <hr class="section-divider">

        <!-- Governance Module Grid -->
        <section class="grid" id="governance-grid"></section>
    </main>

    <div id="footer"></div>
    <div id="breadcrumbs"></div>

    <!-- Core Scripts -->
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/progress.js"></script>
    <script src="../assets/js/darkmode.js"></script>

    <!-- Governance Dashboard Logic -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {

        /* ------------------------------
           GOVERNANCE MODULE LIST
        ------------------------------ */
        const modules = [
            { id: "gov-policies", label: "Policies", href: "policies.html" },
            { id: "gov-oversight", label: "Oversight", href: "oversight.html" },
            { id: "gov-reporting", label: "Reporting Rules", href: "reporting.html" },
            { id: "gov-accountability", label: "Accountability", href: "accountability.html" },
            { id: "gov-escalation", label: "Escalation Procedures", href: "escalation-procedures.html" }
        ];

        /* ------------------------------
           BUILD GOVERNANCE MODULE GRID
        ------------------------------ */
        const grid = document.getElementById("governance-grid");

        modules.forEach(mod => {
            const completed = localStorage.getItem(`progress-${mod.id}`);
            const card = document.createElement("div");
            card.className = "card fade-in";

            card.innerHTML = `
                <div class="card-title">
                    <div class="card-title-icon icon-${mod.id}"></div>
                    <strong>${mod.label}</strong>
                    ${completed ? '<span class="badge badge-sage">Completed</span>' : ''}
                </div>
                <p>Open the ${mod.label} module.</p>
                <div class="card-actions">
                    <a href="${mod.href}" class="btn btn-primary">Open</a>
                    ${completed ? `<button class="btn btn-outline btn-certificate" data-module="${mod.id}">Certificate</button>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });

        /* ------------------------------
           CERTIFICATE BUTTON HOOKS
        ------------------------------ */
        grid.addEventListener("click", (e) => {
            const btn = e.target.closest(".btn-certificate");
            if (!btn) return;

            const moduleId = btn.getAttribute("data-module");
            const certPath = `../certificates/${moduleId}-certificate.html`;
            window.location.href = certPath;
        });

        /* ------------------------------
           GOVERNANCE MODULE SEARCH BAR
           + AUTOCOMPLETE
        ------------------------------ */
        const govInput = document.getElementById("governance-search");
        const govList = document.getElementById("governance-suggestions");

        if (govInput && govList) {
            govInput.addEventListener("input", () => {
                const term = govInput.value.toLowerCase();
                govList.innerHTML = "";

                if (!term) return;

                const matches = modules
                    .filter(m => m.label.toLowerCase().includes(term))
                    .slice(0, 8);

                matches.forEach(m => {
                    const li = document.createElement("li");
                    li.textContent = m.label;
                    li.className = "search-suggestion-item";
                    li.addEventListener("click", () => {
                        window.location.href = m.href;
                    });
                    govList.appendChild(li);
                });
            });
        }
    });
    </script>

</body>
</html>
