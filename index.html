<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BDC Master Container — Enterprise Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --ivory: #fdf7f0;
      --gold: #d4a017;
      --sage: #9bbf9b;
      --dusty-rose: #c58b9b;
      --terracotta: #c76b4b;
      --charcoal: #333333;
      --bg: #f3eee7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--charcoal); display: flex; min-height: 100vh; }

    .sidebar {
      width: 260px;
      background: var(--charcoal);
      color: var(--ivory);
      padding: 1.5rem 1rem;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
    }
    .sidebar h1 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--gold);
    }
    .nav-section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      color: var(--sage);
    }
    .nav-link {
      display: block;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      color: var(--ivory);
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-link.active {
      background: var(--gold);
      color: var(--charcoal);
      font-weight: 600;
    }

    .main {
      margin-left: 260px;
      width: calc(100% - 260px);
      padding: 1.5rem 2rem 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .header-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--charcoal);
    }
    .role-switcher select {
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }

    .template-dock {
      background: var(--ivory);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      border: 1px solid #e0d5c5;
      margin-bottom: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .template-dock h2 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--gold);
    }
    .template-dock-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .template-pill {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid #d0c4b4;
      background: #fff;
      cursor: pointer;
    }
    .template-pill:hover {
      background: var(--sage);
      color: var(--charcoal);
    }
