<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BDC Master Container — Enterprise Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --ivory: #fdf7f0;
      --gold: #d4a017;
      --sage: #9bbf9b;
      --dusty-rose: #c58b9b;
      --terracotta: #c76b4b;
      --charcoal: #333333;
      --bg: #f3eee7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--charcoal); display: flex; min-height: 100vh; }

    .sidebar {
      width: 260px;
      background: var(--charcoal);
      color: var(--ivory);
      padding: 1.5rem 1rem;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
    }
    .sidebar h1 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--gold);
    }
    .nav-section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      color: var(--sage);
    }
    .nav-link {
      display: block;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      color: var(--ivory);
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-link.active {
      background: var(--gold);
      color: var(--charcoal);
      font-weight: 600;
    }

    .main {
      margin-left: 260px;
      width: calc(100% - 260px);
      padding: 1.5rem 2rem 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .header-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--charcoal);
    }
    .role-switcher select {
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }

    .template-dock {
      background: var(--ivory);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      border: 1px solid #e0d5c5;
      margin-bottom: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .template-dock h2 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--gold);
    }
    .template-dock-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .template-pill {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid #d0c4b4;
      background: #fff;
      cursor: pointer;
    }
    .template-pill:hover {
      background: var(--sage);
      color: var(--charcoal);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--ivory);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      border: 1px solid #e0d5c5;
    }
    .card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      margin-left: 0.4rem;
    }
    .badge-gold { background: var(--gold); color: var(--charcoal); }
    .badge-sage { background: var(--sage); color: var(--charcoal); }
    .badge-terracotta { background: var(--terracotta); color: var(--ivory); }
    .badge-rose { background: var(--dusty-rose); color: var(--ivory); }
    .badge-charcoal { background: var(--charcoal); color: var(--ivory); }

    .kpi-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .kpi-table th, .kpi-table td {
      border: 1px solid #e0d5c5;
      padding: 0.3rem 0.4rem;
      text-align: left;
    }
    </section>

    <section id="playbooks" class="card">
      <h3>Playbooks <span class="badge badge-gold">Built</span></h3>
      <details>
        <summary>Concise BDC Playbook</summary>
        <ul class="section-list">
          <li>Quick reference workflows</li>
          <li>Core templates</li>
        </ul>
      </details>
      <details>
        <summary>Full BDC Playbook</summary>
        <ul class="section-list">
          <li>Detailed workflows</li>
          <li>Objection handling</li>
        </ul>
      </details>
      <details>
        <summary>Enterprise BDC Playbook</summary>
        <ul class="section-list">
          <li>Multi‑store governance</li>
        </ul>
      </details>
    </section>

    <section id="messaging" class="card">
      <h3>Messaging System <span class="badge badge-charcoal">Core</span></h3>
      <details>
        <summary>Email Structure</summary>
        <ul class="section-list">
          <li>Subject line rules</li>
          <li>Body format</li>
        </ul>
      </details>
      <details>
        <summary>Text Structure</summary>
        <ul class="section-list">
          <li>Length limits</li>
          <li>Compliance notes</li>
        </ul>
      </details>
      <details>
        <summary>Voicemail Structure</summary>
        <ul class="section-list">
          <li>Intro</li>
          <li>Value hook</li>
        </ul>
      </details>
    </section>

    <section id="workflows" class="card">
      <h3>Workflow System <span class="badge badge-gold">Built</span></h3>
      <p style="font-size:0.85rem;margin-top:0.3rem;">
        All lead types mapped to repeatable steps and matching templates.
      </p>
    </section>

    <section id="qa" class="card">
      <h3>QA Center <span class="badge badge-sage">Stable</span></h3>
      <details>
        <summary>Call Grading</summary>
        <ul class="section-list">
          <li>Greeting</li>
          <li>Needs discovery</li>
        </ul>
      </details>
      <details>
        <summary>Message Scoring</summary>
        <ul class="section-list">
          <li>Clarity</li>
          <li>CTA strength</li>
        </ul>
      </details>
    </section>

    <section id="compliance" class="card">
      <h3>Compliance Command Center <span class="badge badge-terracotta">Needs Attention</span></h3>
      <details>
        <summary>Texting Compliance</summary>
        <ul class="section-list">
          <li>Opt‑in rules</li>
          <li>Opt‑out handling</li>
        </ul>
      </details>
      <details>
        <summary>Pricing Compliance</summary>
        <ul class="section-list">
          <li>Advertised vs quoted</li>
        </ul>
      </details>
    </section>

    <section id="governance" class="card">
      <h3>Governance Center <span class="badge badge-charcoal">Core</span></h3>
      <details>
        <summary>Policy Governance</summary>
        <ul class="section-list">
          <li>BDC policies</li>
        </ul>
      </details>
    </section>

    <section id="continuity" class="card">
      <h3>Continuity Center <span class="badge badge-sage">Stable</span></h3>
      <details>
        <summary>Staffing Continuity</summary>
        <ul class="section-list">
          <li>Coverage plans</li>
        </ul>
      </details>
    </section>

    <section id="brand" class="card">
      <h3>Brand Identity System <span class="badge badge-rose">Optional</span></h3>
      <details>
        <summary>Style Guide</summary>
        <ul class="section-list">
          <li>Colors: ivory, gold, dusty rose, sage, terracotta</li>
        </ul>
      </details>
    </section>

    <section id="training" class="card">
      <h3>Training System <span class="badge badge-rose">Optional</span></h3>
      <details>
        <summary>Rep Quickstart</summary>
        <ul class="section-list">
          <li>Daily routine for 40+ sales/month support</li>
        </ul>
      </details>
    </section>
  </main>

  <script>
    const dailyCheckbox = document.getElementById('dailyMode');
    const nonProdIds = ['brand', 'training', 'governance', 'continuity'];

    dailyCheckbox.addEventListener('change', () => {
      nonProdIds.forEach(id => {
        const section = document.getElementById(id);
        if (section) {
          section.style.display = dailyCheckbox.checked ? 'none' : 'block';
        }
      });
    });
  </script>

</body>
</html>
